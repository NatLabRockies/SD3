                address: 192.168.1.1
                mask: 24
                proto: ospf
                type: ethernet
            ospf:
              dead_interval: 60
              hello_interval: 10
              retrans_interval: 5
              router_id: 192.168.1.1
              areas:
                - area_id: 0
                  area_networks:
                    - network: 192.168.1.1/24
        - type: VirtualMachine
          general:
            hostname: breaker-ied
            vm_type: kvm
            snapshot: true
          hardware:
            memory: 8192
            vcpus: 8
            os_type: linux
            drives:
              - image: ot-sim.qc2
          # injections:
          # - src: /phenix/injects/{{BRANCH_NAME}}/breaker-ied.xml
          #   dst: /etc/ot-sim/config.xml
          # annotations:
          #   helics/federate:
          #     - broker: 172.16.1.1
          #       fed-count: 1
          network:
            interfaces:
              - name: eth0
                vlan: substation-field-lan
                address: 192.168.1.4
                gateway: 192.168.1.1
                mask: 24
                proto: static
                type: ethernet
              - name: eth1
                vlan: MGMT
                dns: 10.10.100.1
                address: 172.16.0.10
                gateway: 172.16.0.12
                mask: 16
                proto: static
                type: ethernet
