          network:
            interfaces:
              - name: eth0
                vlan: substation-dmz
                address: 20.10.0.2
                mask: 16
                proto: ospf
                type: ethernet 
              - name: eth1 
                vlan: substation-OT-lan
                address: 10.10.101.1
                mask: 24
                proto: ospf
                type: ethernet
            ospf:
              dead_interval: 60
              hello_interval: 10
              retrans_interval: 5
              router_id: 10.10.101.1
              areas:
                - area_id: 0
                  area_networks:
                    - network: 10.10.101.0/24
                - area_id: 0
                  area_networks: 
                    - network: 20.10.0.0/16
        - type: VirtualMachine
          general:
            hostname: substation-OT-workstation
            vm_type: kvm
            snapshot: true
          hardware:
            memory: 8192
            vcpus: 2
            os_type: windows
            drives:
              - image: control-center.qc2
          network:
            interfaces:
              - name: eth0
                vlan: substation-OT-lan
                address: 10.10.101.4
                gateway: 10.10.101.1
                mask: 24
                proto: static
                type: ethernet
        - type: VirtualMachine
          general:
            hostname: substation-rtu
            vm_type: kvm
            snapshot: true
          hardware:
            memory: 4196
            vcpus: 2
            os_type: linux
            drives:
              - image: ot-sim.qc2
          # injections:
          # - src: /phenix/injects/{{BRANCH_NAME}}/substation-rtu.xml
          #   dst: /etc/ot-sim/config.xml
          network:
            interfaces:
              - name: eth0
                vlan: substation-OT-lan
                address: 10.10.101.2
                gateway: 10.10.101.1
                mask: 24
                proto: static
                type: ethernet
              - name: eth1
                vlan: substation-field-lan
                address: 192.168.1.2
                gateway: 192.168.1.1
                mask: 24
                proto: static
                type: ethernet
        - type: Router
