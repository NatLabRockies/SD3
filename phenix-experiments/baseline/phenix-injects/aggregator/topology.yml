                - area_id: 0
                  area_networks:
                    - network: 20.1.0.0/16
                - area_id: 0
                  area_networks: 
                    - network: 20.10.0.0/16
        - type: Router
          general:
            hostname: substation-OT-router
            vm_type: kvm
            snapshot: true
