apiVersion: phenix.sandia.gov/v1
kind: Topology
metadata:
    name: ${BRANCH_NAME}
spec:
    nodes:
# substations
        - type: Router
          general:
            hostname: substation-border-router
            vm_type: kvm
            snapshot: true
          hardware:
            memory: 1024
            vcpus: 1
            os_type: vyatta
            drives:
              - image: vyatta.qc2
          network:
            interfaces:
              - name: eth0
                vlan: substation-lan
                address: 20.0.0.1
                mask: 8
                proto: ospf
                type: ethernet
              - name: eth1
                vlan: WAN
                address: 100.0.0.10
                mask: 16
                proto: ospf
                type: ethernet
            ospf:
              dead_interval: 60
              hello_interval: 10
              retrans_interval: 5
              router_id: 20.0.0.1
              areas:
                - area_id: 0
                  area_networks:
                    - network: 100.0.0.0/16
                - area_id: 0
                  area_networks:
                    - network: 20.0.0.0/8
        - type: Router
          general:
            hostname: substation-router
            vm_type: kvm
            snapshot: true
          hardware:
            memory: 1024
            vcpus: 1
            os_type: vyatta
            drives:
              - image: vyatta.qc2
          network:
            interfaces:
              - name: eth0
                vlan: enterprise-lan
                address: 20.1.0.1
                mask: 16
                proto: ospf
                type: ethernet
              - name: eth1
                vlan: substation-lan
                address: 20.0.0.2
                mask: 8
                proto: ospf
                type: ethernet
            ospf:
              dead_interval: 60
              hello_interval: 10
              retrans_interval: 5
              router_id: 20.1.0.1
              areas:
                - area_id: 0
                  area_networks:
                    - network: 20.0.0.0/8
                - area_id: 0
                  area_networks:
                    - network: 20.1.0.0/16
        - type: Router
