                    args: /mirrordata.pcap

        - name: 5s-delay
          type: pause
          metadata:
            duration: 5s
        - name: 30s-delay
          type: pause
          metadata:
            duration: 30s
        - name: 5m-delay
          type: pause
          metadata:
            duration: 300s
        - name: 2m-delay
          type: pause
          metadata:
            duration: 120s
        - name: 1m-delay 
          type: pause
          metadata:
            duration: 60s


