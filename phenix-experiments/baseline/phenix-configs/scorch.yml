apiVersion: phenix.sandia.gov/v2
kind: Scenario
metadata:
  name: ${BRANCH_NAME}_scorch
  annotations:
    topology: ${BRANCH_NAME}
spec: 
  apps: 
  - name: scorch
    metadata:
      filebeat:
        enabled: false
      components:
        - name: kafka-csvs
          type: cc
          metadata:
            vms:
              - hostname: data-sender
                configure:
                  - type: background
                    args: /usr/bin/chmod +x /data-sender/kafka-to-csv; /data-sender/kafka-to-csv -e ${BRANCH_NAME} -s baseline -b ${HOST}
                    wait: false
        - name: postprocess-alfalfa-output
          type: cc
          metadata:
            vms: 
              - hostname: data-sender
                cleanup:
                - type: exec
                  args: /bin/bash /data-sender/process-alfalfa-results.sh
                  wait: true
                  validator: /usr/bin/stat /alfalfa/building_battery_results.tgz
        - name: receive-alfalfa-results
          type: cc
          metadata: 
            vms:
              - hostname: data-sender
                cleanup: 
                - type: recv
                  args: /alfalfa/building_battery_results.tgz
        - name: postprocess-power-data
          type: cc
          metadata:
            vms: 
              - hostname: data-sender
                cleanup:
                - type: exec
                  args: /bin/bash /data-sender/process-power-data.sh true
                  wait: true
                  validator: /usr/bin/stat /grid/grid_results.tgz
        - name: receive-grid-results
          type: cc
          metadata: 
            vms:
              - hostname: data-sender
                cleanup: 
                - type: recv
                  args: /grid/grid_results.tgz
        - name: receive-aggregator-schedule
          type: cc
          metadata: 
            vms:
              - hostname: aggregator
                cleanup: 
                - type: recv
                  args: /usr/src/app/service_area_schedule.csv
        - name: receive-aggregator-logs
          type: cc
          metadata: 
            vms:
              - hostname: aggregator
                cleanup: 
                - type: recv
                  args: /var/log/aggregator.log
        - name: receive-aggregator-service-logs
          type: cc
          metadata: 
            vms:
              - hostname: aggregator
                cleanup: 
                - type: recv
                  args: /var/log/service_area_schedule.log
        - name: check-exp-stopped
          type: cc
          metadata:
            vms:
              - hostname: opendss 
                cleanup:
                  - type: exec
                    wait: true
                    args: |
                      while [ -n "$(pgrep -f 'python3 agent.py')" ]; do
                        sleep 15 
                        echo "waiting for agent.py to end"
                        if grep -q "Freeing" /var/log/power.log; then
                          break
                        fi
                      done
                      echo "agent.py stopped"

        - name: clear_alfalfa
          type: cc
          metadata:
            vms: 
              - hostname: data-sender
                cleanup:
                - type: exec
                  args: /bin/bash /data-sender/clear_alfalfa.sh true
                  wait: false

        - name: clear_kafka_topics
          type: cc
          metadata:
            vms: 
              - hostname: data-sender
                cleanup:
                - type: exec
                  args: /usr/bin/python3 /data-sender/clear_topics.py --b ${HOST}:9092 --e ${BRANCH_NAME}
                  wait: false
        
        - name: attack_dns
          type: cc
          metadata:
            vms: 
              - hostname: aol
                cleanup:
                - type: exec
                  args: /usr/bin/nohup /usr/bin/bash -c '/usr/bin/sleep 300; exec /dnsswitch.sh' </dev/null >>/var/log/dnsswitch.log 2>&1 &
                  wait: false
       
        - name: attack_api
          type: cc
          metadata:
            vms: 
              - hostname: bookworm
                cleanup:
                - type: exec
                  args: /usr/bin/nohup /usr/bin/bash -c '/usr/bin/sleep 4200; exec /apidirectfuzz.sh' </dev/null >>/var/log/apidirectfuzz.log 2>&1 &
                  wait: false

